[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "rsiflow-agent"
version = "0.6.0"
description = "RSIFlow skill-based agent evolution runtime"
readme = "README.md"
license = "MIT"
requires-python = ">=3.11"
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Science/Research",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
keywords = ["ai", "research", "self-improving", "agents", "science"]
dependencies = [
    "python-dotenv>=1.0",
    "numpy>=2.0",
    "pandas>=2.0",
    "scikit-learn>=1.4",
    "fastapi>=0.110",
    "uvicorn>=0.29",
    "pydantic>=2.0",
    "claude-agent-sdk>=0.1.50",
    "PyYAML>=6.0",
    "Jinja2>=3.1",
    "rich>=13.0",
    "json-repair>=0.25",
    "jsonschema>=4.23",
]

[project.optional-dependencies]
claude = ["claude-agent-sdk>=0.1.50"]
openhands = ["openhands-ai>=1.6.0"]
pydantic-ai = ["pydantic-ai>=1.0"]
mlebench = ["google-generativeai>=0.8"]
dev = [
    "pytest>=7.0",
    "ruff>=0.11",
    "httpx>=0.27",  # required by fastapi's TestClient (starlette.testclient)
]
pipeline = [
    "transformers>=4.51",
    "peft>=0.15",
    "accelerate>=1.5",
]
report = [
    "ujson==6.0.0",
    "wget==3.2",
    "appdirs==1.4.4",
    "tempdir==0.7.1",
]

[project.scripts]
rsiflow = "rsiflow.orchestrator:main"


[tool.setuptools.packages.find]
include = ["rsiflow*"]

[tool.setuptools.package-data]
"rsiflow" = [
    "defaults/providers/*.json",
    "defaults/profiles/*.json",
    "web/static/*",
]
"rsiflow.tasks" = [
    "_shared/*",
    "*/data/public/**/*",
    "*/data/private/**/*",
    "*/data/training_data/**/*",
    "*/reference/**/*",
]

[tool.ruff]
target-version = "py311"
line-length = 120
# Task reference agents and sample executions are shipped as template data,
# read by the meta-agent as text. They are not part of the package source.
extend-exclude = ["rsiflow/tasks/"]

[tool.ruff.lint]
select = [
    "E",     # pycodestyle errors
    "W",     # pycodestyle warnings
    "F",     # pyflakes
    "I",     # isort
    "UP",    # pyupgrade
    "B",     # flake8-bugbear
    "SIM",   # flake8-simplify
    "RUF",   # ruff-specific rules
]
ignore = [
    "E501",  # line too long (handled by formatter)
    "B905",  # zip without strict= (python 3.10 compat)
]

[tool.ruff.lint.isort]
known-first-party = ["rsiflow"]

[tool.ty.environment]
python-version = "3.11"
extra-paths = ["tests"]

[tool.ty.src]
# Task reference agents are shipped as templates (read as text by the meta-agent),
# not as importable source. Skip type-checking them.
exclude = ["rsiflow/tasks/"]

[tool.ty.rules]
not-iterable = "ignore"        # false positive on guarded attribute access
unresolved-import = "ignore"   # optional providers are lazily imported, not installed in lint
